name: Adapter proposal
description: 新しいharness adapterの提案
title: "adapter: "
labels: ["type:proposal", "area:adapter"]
body:
  - type: markdown
    attributes:
      value: |
        読む範囲は docs/development/adding-adapter.md に限定されます。既存adapterの実装を読む必要はありません。
  - type: input
    id: harness
    attributes:
      label: Harnessとversion
      placeholder: "harness名 / exact version"
    validations:
      required: true
  - type: textarea
    id: capabilities
    attributes:
      label: 提供するcapabilities
      description: connect / capabilities / submit-observe evidence / dispatch effect intent / interrupt / release / reconcile / health のうち、提供できるものとできないもの
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence source
      description: 完了の正本をどのdurable evidenceから取るか。自然言語、idle、画面表示ではないこと
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Data boundary
      description: adapterだけが保持するもの（session ID、native event、credential location など）と、coreへ渡すもの
    validations:
      required: true
  - type: textarea
    id: unknown
    attributes:
      label: unknownの扱い
      description: effect結果が不明になる経路と、blind retryしないための設計
    validations:
      required: true
  - type: textarea
    id: smoke
    attributes:
      label: Live smokeの方法
      description: opt-inでの実harness検証手順。通常CIからは起動しない
