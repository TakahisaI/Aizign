name: Higher-risk proposal
description: Propose a higher-risk contract, boundary, architecture, or repository-process change before implementation.
title: "proposal: "
labels: ["type:proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Aizign is proposal-first. Agree on the changed contract or process decision before implementation preparation.
        Proposal acceptance authorizes preparation only. Implementation starts after an exact-base checkpoint and a separate Maintainer `Ready for implementation` decision.
        This form is for Higher-risk proposals. Ordinary changes use the ordinary Issue/PR path described in CONTRIBUTING.md. If classification is uncertain, choose Unsure for Maintainer decision.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the observed problem and why it matters now.
    validations:
      required: true
  - type: dropdown
    id: change_class
    attributes:
      label: Change class
      description: Choose Higher-risk for this form. Use Unsure when the Maintainer must decide whether the proposal is Higher-risk. Ordinary changes use the ordinary Issue/PR path described in CONTRIBUTING.md.
      options:
        - Higher-risk change
        - Unsure
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: Proposed contract or process decision
      description: State what will become true. Name public behavior, API, schema, durable data, architecture, support, security, or repository-process changes.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: In scope and out of scope
      description: Name the affected bounded contexts or process surfaces and the important exclusions.
      placeholder: |
        In scope:
        - <path, context, or process surface>

        Out of scope:
        - <area and reason>
    validations:
      required: true
  - type: textarea
    id: authority_owner
    attributes:
      label: Canonical authority, owner, and old paths
      description: >-
        Name the proposed authority direction and owner. State the policy for
        old paths: deleted, migrated, provisional (owner/trigger), or retained
        (distinct responsibility). Exact file-level mapping may remain for the
        post-acceptance implementation checkpoint.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Failure case and required evidence
      description: Give at least one concrete way the proposal could be wrong and the test, inspection, or observation that should detect it.
    validations:
      required: true
  - type: dropdown
    id: adr
    attributes:
      label: Is an ADR required?
      description: Refer to CONTRIBUTING.md for whether an ADR is required. This field only records Yes, No, or Unsure; the form does not define ADR scope.
      options:
        - "Yes"
        - "No"
        - "Unsure"
    validations:
      required: true
  - type: textarea
    id: implementation_readiness
    attributes:
      label: Pre-implementation readiness
      description: >-
        Keep the initial status as Not ready. After proposal acceptance,
        inspect one exact main commit and record the concrete checkpoint in
        this Issue, usually as a comment. Do not guess file-level answers while
        opening the proposal.
      value: |
        Status: Not ready

        Implementation must not begin until:
        - [ ] the proposal decision is accepted;
        - [ ] any required ADR/specification reference or planned ADR path is recorded;
        - [ ] one exact `main` commit is recorded;
        - [ ] normative authorities, single implementation owners, and consumers are identified;
        - [ ] every overlapping or duplicate path has a disposition;
        - [ ] reviewable implementation slices are classified as independent or ordered, with a predecessor condition for each ordered slice;
        - [ ] each slice records changes, deletions or migrations, preserved behavior, evidence, and exclusions;
        - [ ] unresolved decisions, evidence gaps, and stop conditions are recorded; and
        - [ ] a Maintainer records `Ready for implementation` for the checkpoint.

        Preparation result:
        - Checkpoint:
        - Ready decision:
    validations:
      required: true
