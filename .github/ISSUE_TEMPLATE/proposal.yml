name: Proposal
description: Propose a contract, boundary, architecture, or repository-process change before implementation.
title: "proposal: "
labels: ["type:proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Aizign is proposal-first. Agree on the changed contract or process decision before implementation.
        Routine changes stay on the ordinary contribution path. Boundary changes and Milestone reviews use the pilot conductor workflow in `docs/development/change-workflow.md`.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the observed problem and why it matters now.
    validations:
      required: true
  - type: dropdown
    id: change_class
    attributes:
      label: Change class
      description: Choose the closest class. The Conductor may correct the classification before implementation.
      options:
        - Routine change
        - Boundary change
        - Milestone review
        - Unsure
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: Proposed contract or process decision
      description: State what will become true. Name public behavior, API, schema, durable data, architecture, support, security, or repository-process changes.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: In scope and out of scope
      description: Name the affected bounded contexts or process surfaces and the important exclusions.
      placeholder: |
        In scope:
        - <path, context, or process surface>

        Out of scope:
        - <area and reason>
    validations:
      required: true
  - type: textarea
    id: ownership
    attributes:
      label: Canonical owner and old paths
      description: For Boundary work, name the authoritative owner and say whether overlapping old paths are deleted, migrated, provisional, or retained for a distinct reason.
  - type: textarea
    id: evidence
    attributes:
      label: Failure case and required evidence
      description: Give at least one concrete way the proposal could be wrong and the test, inspection, or observation that should detect it.
    validations:
      required: true
  - type: dropdown
    id: adr
    attributes:
      label: Is an ADR required?
      description: ADRs are required for architecture, boundary, contribution/review/merge policy, Protocol or journal shape, runtime dependency, data boundary, retry policy, toolchain support, and release or compatibility policy.
      options:
        - "No"
        - "Yes — include the ADR before implementing the affected decision"
        - "Unsure"
    validations:
      required: true
  - type: textarea
    id: invariants
    attributes:
      label: Related hard invariants
      description: Reference `docs/architecture/invariants.md`, or state why no hard invariant applies.
  - type: textarea
    id: legacy
    attributes:
      label: Adoption from the legacy implementation, if applicable
      description: State Adopt, Reject, or Defer. Rewrite every adopted contract as a new test under ADR-0006.
