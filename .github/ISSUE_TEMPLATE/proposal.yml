name: Proposal
description: Propose a contract, boundary, architecture, or repository-process change before implementation.
title: "proposal: "
labels: ["type:proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Aizign is proposal-first. Agree on the changed contract or process decision before implementation.
        Use the Ordinary class for changes that preserve an accepted owner-local contract. Use Higher-risk for changes that alter a public or repository-level contract, claim, or boundary.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the observed problem and why it matters now.
    validations:
      required: true
  - type: dropdown
    id: change_class
    attributes:
      label: Change class
      description: Choose Ordinary when the accepted owner-local contract and public claims remain unchanged; otherwise choose Higher-risk. Use Unsure when the Maintainer must decide.
      options:
        - Ordinary change
        - Higher-risk change
        - Unsure
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: Proposed contract or process decision
      description: State what will become true. Name public behavior, API, schema, durable data, architecture, support, security, or repository-process changes.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: In scope and out of scope
      description: Name the affected bounded contexts or process surfaces and the important exclusions.
      placeholder: |
        In scope:
        - <path, context, or process surface>

        Out of scope:
        - <area and reason>
    validations:
      required: true
  - type: textarea
    id: authority_owner
    attributes:
      label: Canonical authority, owner, and old paths
      description: >-
        Name authority/owner. For old paths, state deleted, migrated, provisional
        (owner/trigger), or retained (distinct responsibility). For Ordinary,
        identify the owner-local contract or write "None".
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Failure case and required evidence
      description: Give at least one concrete way the proposal could be wrong and the test, inspection, or observation that should detect it.
    validations:
      required: true
  - type: dropdown
    id: adr
    attributes:
      label: Is an ADR required?
      description: ADRs are required for architecture, boundaries, contribution/review/merge policy, Protocol or journal shape, runtime dependency, data boundary, retry, toolchain, release, or compatibility policy.
      options:
        - "No"
        - "Yes — include the ADR before implementing the affected decision"
        - "Unsure"
    validations:
      required: true
