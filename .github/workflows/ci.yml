name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# Least privilege: CI only reads the checkout. Nothing here publishes,
# comments, or touches secrets; fork PRs receive no credentials.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup target add x86_64-unknown-linux-gnux32
          rustup show

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked

      - name: Install cargo-deny
        uses: taiki-e/install-action@6cd13508893c0e7eab5f273c2575d3859bd7229a # v2.86.6
        with:
          tool: cargo-deny@0.20.2

      - name: Format, lint, test, doc, deny
        run: cargo xtask rust-check

      - name: Verify the unsupported x32 ABI fails closed at compile time
        run: cargo check --workspace --all-targets --all-features --target x86_64-unknown-linux-gnux32

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Node is set up before the checkout on purpose: setup-node invokes the
      # runner's bundled npm, and with package.json present that npm would be
      # rejected by devEngines before we get a chance to align it.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Align node and npm with the repository pins
        shell: bash
        run: |
          set -euo pipefail
          pinned_node="$(tr -d '[:space:]' < .node-version)"
          if [[ "v${pinned_node}" != "$(node --version)" ]]; then
            echo "::error::.node-version (${pinned_node}) and the workflow's node-version differ; update both"
            exit 1
          fi
          required_npm="$(node -p "(require('./package.json').packageManager || '').replace(/^npm@/, '')")"
          if [[ -n "${required_npm}" && "$(npm --version)" != "${required_npm}" ]]; then
            (cd "${RUNNER_TEMP}" && npm install --global "npm@${required_npm}")
          fi
          node --version
          npm --version

      - name: Install the pinned Rust toolchain (for the real-binary round trip)
        run: |
          rustup toolchain install
          rustup show

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build the aizign binary
        run: cargo build --quiet -p aizign-cli

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Quick launcher refuses a missing lockfile without replacing it
        shell: bash
        run: |
          set -euo pipefail
          mv Cargo.lock Cargo.lock.quick-test
          restore_lock() { mv Cargo.lock.quick-test Cargo.lock; }
          trap restore_lock EXIT
          if output="$(cargo xtask quick --help 2>&1)"; then
            echo "::error::quick unexpectedly started without Cargo.lock"
            exit 1
          fi
          [[ ! -e Cargo.lock ]] || { echo "::error::quick regenerated Cargo.lock"; exit 1; }
          grep -F -- "--frozen" <<<"${output}"
          restore_lock
          trap - EXIT

      - name: Quick dependency preflight reports an actionable setup
        shell: bash
        run: |
          set -euo pipefail
          mv node_modules/@types/node node_modules/@types/node.quick-test
          restore_node_types() { mv node_modules/@types/node.quick-test node_modules/@types/node; }
          trap restore_node_types EXIT
          if output="$(cargo xtask quick 2>&1)"; then
            echo "::error::quick unexpectedly accepted an incomplete npm dependency tree"
            exit 1
          fi
          grep -F -- "npm ci --no-audit --no-fund" <<<"${output}"
          restore_node_types
          trap - EXIT

      - name: Quick profiles use shared fixtures and the Cargo-reported binary
        shell: bash
        run: |
          set -euo pipefail
          cargo xtask quick protocol
          CARGO_TARGET_DIR="${RUNNER_TEMP}/quick-target" cargo xtask quick adapter-dsh

      - name: Lint, build, typecheck, test, pack (with the real binary)
        run: npm run check
        env:
          AIZIGN_BINARY: ${{ github.workspace }}/target/debug/aizign

  repository:
    name: Repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup show

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked

      - name: Conformance fixtures
        run: cargo xtask conformance

      - name: Public audit
        run: cargo xtask public-audit

      - name: Whitespace errors
        run: cargo xtask whitespace
