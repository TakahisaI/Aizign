name: Performance smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: performance-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: -D warnings

jobs:
  smoke:
    name: Linux gross-regression observation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Align npm with the repository pin
        shell: bash
        run: |
          set -euo pipefail
          required_npm="$(node -p "(require('./package.json').packageManager || '').replace(/^npm@/, '')")"
          if [[ -n "${required_npm}" && "$(npm --version)" != "${required_npm}" ]]; then
            (cd "${RUNNER_TEMP}" && npm install --global "npm@${required_npm}")
          fi
          node --version
          npm --version

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup show

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install TypeScript dependencies
        run: npm ci --no-audit --no-fund

      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked

      - name: Run informational performance smoke
        id: performance_smoke
        run: cargo xtask performance-smoke

      - name: Add report to the job summary
        if: always()
        shell: bash
        run: |
          if [[ -f target/performance-smoke/summary.md ]]; then
            cat target/performance-smoke/summary.md >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "Performance smoke did not produce a summary." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Report the informational result
        if: always() && steps.performance_smoke.outcome == 'failure'
        run: echo "::warning::Performance smoke failed or exceeded an informational ceiling; inspect the summary and artifact."

      - name: Upload machine and human reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aizign-performance-smoke-${{ github.sha }}
          path: target/performance-smoke
          if-no-files-found: error
          retention-days: 14
