name: Release

# Tag `vX.Y.Z` on main -> full gate -> GitHub Release with generated notes.
# The tagged commit must be the current default-branch tip (fail closed), so a
# tag on an old or side-branch commit cannot release a tree the readiness
# review never saw (#33). Version lockstep across every crate and package is
# enforced by `cargo xtask public-audit` inside the gate.
# No artifacts are attached and nothing is published to a registry (ADR-0008).
# This is the only workflow with write permission, and only for releases.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: -D warnings

jobs:
  gate:
    name: Full gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify the tag is the default-branch tip
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "${DEFAULT_BRANCH}"
          tip="$(git rev-parse "origin/${DEFAULT_BRANCH}")"
          tagged="$(git rev-parse HEAD)"
          if [[ "${tagged}" != "${tip}" ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} points at ${tagged}, but ${DEFAULT_BRANCH} is at ${tip}; releases bind only to the reviewed tip (docs/development/releasing.md)"
            exit 1
          fi
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

      - name: Verify the tag matches the workspace version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          npm_version="$(node -p "require('./package.json').version")"
          if [[ "${tag}" != "${cargo_version}" || "${tag}" != "${npm_version}" ]]; then
            echo "::error::tag v${tag} does not match Cargo.toml (${cargo_version}) / package.json (${npm_version})"
            exit 1
          fi

      - name: Align node and npm with the repository pins
        shell: bash
        run: |
          set -euo pipefail
          pinned_node="$(tr -d '[:space:]' < .node-version)"
          [[ "v${pinned_node}" == "$(node --version)" ]] || { echo "::error::.node-version mismatch"; exit 1; }
          required_npm="$(node -p "(require('./package.json').packageManager || '').replace(/^npm@/, '')")"
          if [[ -n "${required_npm}" && "$(npm --version)" != "${required_npm}" ]]; then
            (cd "${RUNNER_TEMP}" && npm install --global "npm@${required_npm}")
          fi

      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install
          rustup show

      - name: Install cargo-deny
        uses: taiki-e/install-action@6cd13508893c0e7eab5f273c2575d3859bd7229a # v2.86.6
        with:
          tool: cargo-deny@0.20.2

      - name: Full gate
        run: cargo xtask check

  release:
    name: GitHub Release
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Aizign ${GITHUB_REF_NAME}" \
            --generate-notes \
            --notes "Protocol version 1, journal schema version 1. See docs/reference/compatibility.md. No registry publication (ADR-0008)."
