name: Security

on:
  schedule:
    # Weekly advisory sweep; advisories change without code changes.
    - cron: "17 3 * * 1"
  pull_request:
    paths:
      - .cargo-deny-version
      - Cargo.lock
      - deny.toml
      - package-lock.json
      - .github/scripts/read-cargo-deny-version.sh
      - .github/scripts/check-source-workspace.mjs
      - .github/workflows/security.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-deny:
    name: cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup show

      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked

      - name: Read the repository cargo-deny pin
        id: cargo_deny_version
        shell: bash
        run: |
          version="$(bash .github/scripts/read-cargo-deny-version.sh)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install cargo-deny
        uses: taiki-e/install-action@6cd13508893c0e7eab5f273c2575d3859bd7229a # v2.86.6
        with:
          tool: cargo-deny@${{ steps.cargo_deny_version.outputs.version }}

      - name: Advisories, bans, licenses, sources
        run: cargo deny check advisories bans licenses sources
