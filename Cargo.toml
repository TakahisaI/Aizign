[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/TakahisaI/Aizign"
# Registry publication is disabled until v0.1 acceptance (ADR-0008).
publish = false

[workspace.dependencies]
aizign-core = { path = "crates/aizign-core", version = "0.1.0" }
aizign-engine = { path = "crates/aizign-engine", version = "0.1.0" }
aizign-protocol = { path = "crates/aizign-protocol", version = "0.1.0" }
aizign-store-jsonl = { path = "crates/aizign-store-jsonl", version = "0.1.0" }
aizign-testkit = { path = "crates/aizign-testkit", version = "0.1.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.143"
sha2 = { version = "=0.11.0", default-features = false }
rustix = { version = "=1.1.4", default-features = false, features = ["std", "fs"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
